worker_processes 1;

events { worker_connections 1024; }

http {
    include    mime.types;

    proxy_cache_path /etc/nginx/cache/ levels=1:2 keys_zone=backcache:8m max_size=50m;
    proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
    proxy_cache_valid 200 302 10m;
    proxy_cache_valid 404 1m;

    # Docker's DNS server. Upstream names resolve per request (through the variables below),
    # so the proxy keeps working when a service container restarts and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        # listen 443 ssl;
        server_name localhost out-of-tune.org app.out-of-tune.org;

        set $auth_upstream http://auth:4000;
        set $apollo_upstream http://apollo:3003;
        set $share_upstream http://share:4444;
        set $client_upstream http://client:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_buffering off;
        proxy_buffer_size 4k;

        gzip on;
        gzip_types 
            text/css
            text/javascript
            text/xml
            text/plain
            text/x-component
            application/javascript
            application/json
            application/xml
            application/rss+xml
            font/truetype
            font/opentype
            application/vnd.ms-fontobject
            image/svg+xml;
        gzip_min_length 1000;
        gzip_proxied any;

        location /auth {
            expires -1;
            add_header Cache-Control "no-store";
            proxy_pass $auth_upstream;
            rewrite ^/auth(.*)$ $1 break;
        }

        location /apollo {
            proxy_pass $apollo_upstream;
            rewrite ^/apollo(.*)$ $1 break;
        }

        location /share {
            client_max_body_size 50M;
            proxy_cache backcache;
            proxy_cache_bypass $http_cache_control;
            add_header X-Proxy-Cache $upstream_cache_status;
            proxy_pass $share_upstream;
            rewrite ^/share(.*)$ $1 break;

        }

        # The entry page names the hashed asset files of the current build, so it must never be cached.
        # Otherwise browsers load the previous build for up to 10 minutes after a deploy.
        location ~ ^/(index\.html)?$ {
            expires -1;
            proxy_pass $client_upstream;
        }

        location / {
            proxy_cache backcache;
            proxy_cache_bypass $http_cache_control;
            add_header X-Proxy-Cache $upstream_cache_status;
            proxy_pass $client_upstream;
        }
    }
}