directive @deprecated(
  reason: String = "No longer supported"
) on FIELD_DEFINITION | ENUM_VALUE

directive @cacheControl(
  maxAge: Int
  scope: String
) on FIELD_DEFINITION | OBJECT

type Artist @cacheControl(maxAge: 1000) {
  id: ID!
  sid: String
  mbid: String
  name: String!
  genres: [Genre]
  images: [String]
  popularity: Int @cacheControl(maxAge: 60)
}

type Genre @cacheControl(maxAge: 1000) {
  id: ID!
  name: String!
  artists: [Artist]
  subgenres: [Genre]
  supergenres: [Genre]
}

type Token {
  token: String
  expires_in: String
}

enum NUMCOMP {
  LT
  GT
  EQ
  LTEQ
  GTEQ
  IN
}

input NumericsFilter {
  comp: NUMCOMP!
  val: Int!
  val2: Int
}

enum STRCOMP {
  LIKE
  EQ
}

input StringFilter {
  comp: STRCOMP!
  val: String!
}

type AddArtistResponse {
  success: Boolean!
  message: String
  artist: Artist
}

"A tag of MusicBrainz with the number of users who gave it."
type MusicTag {
  name: String!
  count: Int!
}

enum MetadataStatus {
  FOUND
  NOT_FOUND
  "Not looked up yet. Ask again in a few seconds."
  PENDING
}

"""
Metadata from MusicBrainz, the open music database, for a Spotify artist or album.
An album is a MusicBrainz release group. The answers are never cached, because a
PENDING answer becomes FOUND or NOT_FOUND.
"""
type MusicMetadata {
  "Spotify id."
  sid: ID!
  status: MetadataStatus!
  mbid: String
  "MusicBrainz page."
  url: String
  "Average rating of the users, 0 to 5."
  rating: Float
  ratingVotes: Int
  genres: [MusicTag!]!
  tags: [MusicTag!]!
  "Artist: Person, Group, Orchestra... Album: Album, EP, Single..."
  type: String
  "Album: Live, Compilation, Remix..."
  secondaryTypes: [String!]!
  country: String
  area: String
  "Artist: the year it began. Album: the year of its first release."
  beginYear: Int
  endYear: Int
}

type Query {
  artist(id: ID, sid: ID, mbid: ID, name: String, limit: Int = 10): [Artist]
  genre(id: ID, name: String, limit: Int = 10): [Genre]
  publicToken: Token
  """
  Metadata of up to 200 Spotify artists, in the order of the ids. With urgent, the ids that
  are not known yet go before the rest of the queue: for a node that a user looks at.
  """
  artistMetadata(sids: [ID!]!, urgent: Boolean = false): [MusicMetadata!]!
  "Metadata of up to 200 Spotify albums, like artistMetadata."
  albumMetadata(sids: [ID!]!, urgent: Boolean = false): [MusicMetadata!]!
}

type Mutation {
  createfeedback(feedback: String!, email: String, type: String, group: String): Boolean!
  addArtist(sid: ID!): AddArtistResponse!
}
